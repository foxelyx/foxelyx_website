<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Custom web and mobile app interfaces</title>
  <desc id="desc">Abstract FOXELYX branded dashboard and mobile app panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset=".52" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0b0b0b" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="1000" cy="90" r="180" fill="#f97316" opacity=".18"/>
  <circle cx="160" cy="520" r="220" fill="#6366f1" opacity=".16"/>
  <g filter="url(#shadow)">
    <rect x="160" y="125" width="600" height="350" rx="32" fill="#fff" opacity=".95"/>
    <rect x="200" y="170" width="220" height="26" rx="13" fill="#0b0b0b"/>
    <rect x="200" y="230" width="500" height="42" rx="18" fill="#f3f4f6"/>
    <rect x="200" y="300" width="140" height="105" rx="22" fill="url(#brand)"/>
    <rect x="370" y="300" width="140" height="105" rx="22" fill="#111827"/>
    <rect x="540" y="300" width="140" height="105" rx="22" fill="#e5e7eb"/>
    <rect x="820" y="90" width="220" height="420" rx="44" fill="#111827"/>
    <rect x="842" y="128" width="176" height="344" rx="28" fill="#fff"/>
    <rect x="870" y="170" width="120" height="120" rx="26" fill="url(#brand)"/>
    <rect x="870" y="325" width="120" height="18" rx="9" fill="#111827"/>
    <rect x="870" y="365" width="88" height="18" rx="9" fill="#e5e7eb"/>
  </g>
</svg>
