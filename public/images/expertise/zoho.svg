<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Zoho CRM workflow setup</title>
  <desc id="desc">Premium automation workspace with connected CRM, books, and desk cards.</desc>
  <defs>
    <radialGradient id="bg" cx="68%" cy="20%" r="85%">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset=".45" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset=".5" stop-color="#6a5acd"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect x="84" y="70" width="1032" height="462" rx="44" fill="#fff" opacity=".08" stroke="#fff" stroke-opacity=".18"/>
  <path d="M180 418C330 246 420 484 556 282s332-72 474-178" fill="none" stroke="url(#line)" stroke-width="12" stroke-linecap="round" opacity=".72"/>
  <g filter="url(#shadow)">
    <rect x="122" y="156" width="282" height="188" rx="32" fill="url(#card)"/>
    <rect x="458" y="86" width="282" height="188" rx="32" fill="url(#card)"/>
    <rect x="794" y="236" width="282" height="188" rx="32" fill="url(#card)"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-weight="800">
    <text x="170" y="226" font-size="42" fill="#0b0b0b">CRM</text>
    <text x="506" y="156" font-size="42" fill="#0b0b0b">BOOKS</text>
    <text x="842" y="306" font-size="42" fill="#0b0b0b">DESK</text>
  </g>
  <g>
    <rect x="170" y="264" width="168" height="18" rx="9" fill="#111827" opacity=".18"/>
    <rect x="170" y="300" width="112" height="18" rx="9" fill="#f97316"/>
    <rect x="506" y="196" width="160" height="18" rx="9" fill="#111827" opacity=".18"/>
    <rect x="506" y="232" width="118" height="18" rx="9" fill="#6a5acd"/>
    <rect x="842" y="346" width="166" height="18" rx="9" fill="#111827" opacity=".18"/>
    <rect x="842" y="382" width="96" height="18" rx="9" fill="#22c55e"/>
  </g>
  <g fill="#fff" opacity=".72">
    <circle cx="404" cy="250" r="8"/>
    <circle cx="740" cy="190" r="8"/>
    <circle cx="794" cy="330" r="8"/>
  </g>
  <g opacity=".6">
    <rect x="154" y="474" width="210" height="14" rx="7" fill="#fff"/>
    <rect x="154" y="504" width="138" height="12" rx="6" fill="#fff" opacity=".42"/>
  </g>
</svg>
